<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Thailand Travel Guide - Premium</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e1e2f">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            --bg: #121212;
            --surface: #1e1e2f;
            --card: #2a2a3a;
            --text: #eeeeee;
            --text-secondary: #bbbbbb;
            --border: #444;
            --accent: #ff7b00;
            --shadow: rgba(0,0,0,0.5);
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
        }

        body.light {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #4a4a5a;
            --border: #dddddd;
            --accent: #e65c00;
            --shadow: rgba(0,0,0,0.1);
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent), #ffaa44);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .toolbar {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
        }

        button, .lang-btn, .premium-badge {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .premium-badge {
            background: #ffd966;
            color: #1e1e2f;
            border: none;
            font-weight: bold;
        }

        button.active-lang {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .sponsor {
            background: var(--surface);
            border-radius: 1.5rem;
            padding: 1rem;
            margin: 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid var(--border);
        }

        .sponsor-img {
            width: 120px;
            height: 60px;
            object-fit: cover;
            border-radius: 12px;
            background: #ccc;
        }

        .sponsor-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            text-align: center;
        }

        .carousel-container {
            position: relative;
            margin: 1rem 0;
        }

        .carousel-wrapper {
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            display: flex;
            gap: 0;
            scrollbar-width: thin;
        }

        .carousel-slide {
            flex: 0 0 100%;
            scroll-snap-align: start;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: 0.5rem;
        }

        @media (min-width: 768px) {
            .carousel-slide {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background: var(--card);
            border-radius: 1.5rem;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid var(--border);
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #555;
        }

        .card-content {
            padding: 1rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .lock-overlay {
            background: rgba(0,0,0,0.7);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .paypal-modal {
            background: var(--surface);
            border-radius: 2rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--accent);
        }

        .carousel-nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .nav-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border);
            cursor: pointer;
        }

        .nav-dot.active {
            background: var(--accent);
            width: 24px;
            border-radius: 5px;
        }

        .detail-page {
            background: var(--bg);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .detail-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 1.5rem;
            margin-bottom: 1rem;
        }

        .back-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            margin-bottom: 1rem;
            display: inline-block;
            cursor: pointer;
        }

        .official-link {
            display: inline-block;
            margin-top: 1rem;
            background: var(--accent);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            text-decoration: none;
        }

        footer {
            margin-top: 2rem;
            padding: 1.5rem 0;
            text-align: center;
            border-top: 1px solid var(--border);
        }

        .map-frame {
            margin: 1.5rem 0;
            border-radius: 1.5rem;
            overflow: hidden;
            height: 250px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .contact-email {
            color: var(--accent);
            text-decoration: none;
        }

        .hidden {
            display: none;
        }

        .upgrade-btn {
            background: #ffaa00;
            color: #1e1e2f;
            font-weight: bold;
            border: none;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <header>
        <h1 id="page-title">✨ Thailand Travel Guide</h1>
        <div class="toolbar">
            <span id="premiumStatusBadge" class="premium-badge">🆓 Free</span>
            <button id="themeToggle">🌓 Dark/Light</button>
            <div>
                <button data-lang="en" class="lang-btn active-lang">🇬🇧 EN</button>
                <button data-lang="zh" class="lang-btn">🇨🇳 中文</button>
                <button data-lang="th" class="lang-btn">🇹🇭 ไทย</button>
                <button data-lang="ja" class="lang-btn">🇯🇵 日本語</button>
            </div>
        </div>
    </header>

    <div id="sponsorTop" class="sponsor">
        <img id="sponsorTopImg" class="sponsor-img" src="https://picsum.photos/id/10/120/60" alt="Amazing Thailand">
        <a id="sponsorTopLink" href="https://www.tourismthailand.org" target="_blank" class="sponsor-btn">Visit Official Site</a>
    </div>

    <div id="mainView">
        <div class="carousel-container">
            <div class="carousel-wrapper" id="carouselWrapper">
                <div class="carousel-slide" id="slide1"></div>
                <div class="carousel-slide" id="slide2"></div>
            </div>
            <div class="carousel-nav" id="carouselNav"></div>
        </div>
        <div id="upgradeTeaser" class="sponsor" style="justify-content: center; text-align: center;">
            <span>🔒 6 more places & detailed access info available in Premium</span>
            <button id="showPaypalModalBtn" class="upgrade-btn">⭐ Upgrade to Premium (PayPal)</button>
        </div>
    </div>

    <div id="sponsorBottom" class="sponsor">
        <img id="sponsorBottomImg" class="sponsor-img" src="https://picsum.photos/id/26/120/60" alt="Phuket Tourism">
        <a id="sponsorBottomLink" href="https://www.phuket.net" target="_blank" class="sponsor-btn">Phuket Official Guide</a>
    </div>

    <div class="map-frame">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d198413.21010103857!2d100.49319470273437!3d13.7367173177169!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30e29f2d386c6c8f%3A0x6c49b9d4b5f7b9a4!2z4Lia4Li44LiH4LmA4LiX4Lia4Liy4Lia4Liy4Lil4Liy4LiB4LmA4LiU4Lix4LiZ4LmM4Lio4Liy4LiZ4LiB4Liy4Lij4LmM4Lir4Liy4LiZ4LiY4LmJ4Liy!5e0!3m2!1sen!2sth!4v1650000000000!5m2!1sen!2sth" allowfullscreen loading="lazy"></iframe>
    </div>

    <div id="detailView" class="hidden"></div>

    <footer>
        <div>Contact us<br><a href="mailto:mementomorikatsu@gmail.com" class="contact-email">mementomorikatsu@gmail.com</a></div>
    </footer>
</div>

<script>
    // ======================= 完全な12スポットのデータ（多言語詳細付き） =======================
    const fullPlaces = [
        { id:0, img:"https://picsum.photos/id/104/400/300", title:{en:"Wat Phra Kaew (Emerald Buddha)",zh:"玉佛寺",th:"วัดพระแก้ว",ja:"ワット・プラケオ（エメラルド仏）"},
          shortDesc:{en:"The most sacred temple in Thailand.",zh:"泰国最神圣的寺庙。",th:"วัดที่ศักดิ์สิทธิ์ที่สุดของไทย",ja:"タイで最も神聖な寺院"},
          detail:{en:"Located within Grand Palace complex. Dress code strictly enforced. Marvel at the Emerald Buddha carved from a single jade stone.",zh:"位于大皇宫内。着装要求严格。欣赏由整块翡翠雕刻而成的玉佛。",th:"ตั้งอยู่ในเขตพระราชวังใหญ่ ต้องแต่งกายสุภาพ ชมพระแก้วมรกต",ja:"大宮殿の敷地内。服装規定あり。ヒスイの一塊から彫られたエメラルド仏を鑑賞。"},
          station:{en:"MRT Sanam Chai + 10 min walk",zh:"MRT Sanam Chai站 步行10分钟",th:"MRT สนามไชย เดิน 10 นาที",ja:"MRTサナームチャイ駅 徒歩10分"},
          url:"https://www.royalgrandpalace.th/" },
        { id:1, img:"https://picsum.photos/id/106/400/300", title:{en:"Wat Pho (Reclining Buddha)",zh:"卧佛寺",th:"วัดโพธิ์",ja:"ワット・ポー（涅槃仏）"},
          shortDesc:{en:"Giant reclining Buddha & Thai massage school.",zh:"巨大卧佛和泰式按摩学校。",th:"พระนอนขนาดใหญ่และโรงเรียนนวดแผนไทย",ja:"巨大な涅槃仏とタイ古式マッサージ学校"},
          detail:{en:"46m long gold-plated reclining Buddha. Birthplace of traditional Thai massage. Get a massage after temple visit.",zh:"46米长金箔卧佛。泰式按摩的发源地。参观后可以体验按摩。",th:"พระนอนทองคำยาว 46 เมตร แหล่งกำเนิดนวดแผนไทย นวดหลังวัด",ja:"全長46mの金箔涅槃仏。タイ古式マッサージ発祥の地。寺院見学後にマッサージを。"},
          station:{en:"MRT Sanam Chai / Ferry to Tha Tien",zh:"MRT Sanam Chai站 / 渡轮至Tha Tien",th:"MRT สนามไชย / เรือถึงท่าเตียน",ja:"MRTサナームチャイ駅 / フェリーでTha Tienへ"},
          url:"https://www.watpho.com/" },
        { id:2, img:"https://picsum.photos/id/96/400/300", title:{en:"Chatuchak Market",zh:"乍都乍周末市场",th:"ตลาดนัดจตุจักร",ja:"チャトゥチャック市場"},
          shortDesc:{en:"Weekend mega market (15,000+ stalls)",zh:"周末巨型市场（超过15000个摊位）",th:"ตลาดนัดสุดสัปดาห์ 15,000+ ร้าน",ja:"週末限定の巨大マーケット（15,000店以上）"},
          detail:{en:"Only open Sat-Sun. Everything from vintage clothes to local art. Best street food in Bangkok.",zh:"仅周末开放。从复古服装到本地艺术品应有尽有。曼谷最好的街头美食。",th:"เปิดเสาร์-อาทิตย์ ทุกอย่างตั้งแต่เสื้อผ้าวินเทจถึงงานศิลปะ อาหารริมทางที่ดีที่สุดในกรุงเทพฯ",ja:"土曜・日曜のみ営業。ビンテージ服から地元アートまで。バンコク最高の屋台。"},
          station:{en:"BTS Mo Chit / MRT Chatuchak Park",zh:"BTS Mo Chit站 / MRT Chatuchak Park站",th:"BTS หมอชิต / MRT สวนจตุจักร",ja:"BTSモーチット駅 / MRTチャトゥチャックパーク駅"},
          url:"https://www.chatuchakmarket.org/" },
        { id:3, img:"https://picsum.photos/id/30/400/300", title:{en:"Ayutthaya Historical Park",zh:"大城历史公园",th:"อุทยานประวัติศาสตร์อยุธยา",ja:"アユタヤ歴史公園"},
          shortDesc:{en:"UNESCO World Heritage ancient capital",zh:"联合国教科文组织世界遗产古都",th:"เมืองหลวงเก่า มรดกโลก",ja:"ユネスコ世界遺産の古都"},
          detail:{en:"1.5h train from Bangkok. Rent a bicycle to explore Wat Mahathat (Buddha head in tree roots).",zh:"从曼谷乘火车1.5小时。租自行车游览玛哈泰寺（树根中的佛头）。",th:"รถไฟ 1.5 ชม. จากกรุงเทพฯ ปั่นจักรยานชมวัดมหาธาตุ (พระพักตร์ในรากไม้)",ja:"バンコクから電車で1.5時間。自転車でワット・マハタート（木の根に絡まった仏頭）を巡る。"},
          station:{en:"Ayutthaya Railway Station",zh:"大城火车站",th:"สถานีรถไฟอยุธยา",ja:"アユタヤ駅"},
          url:"https://www.ayutthaya-history.com/" },
        { id:4, img:"https://picsum.photos/id/152/400/300", title:{en:"Chiang Mai Old City",zh:"清迈古城",th:"เมืองเก่าเชียงใหม่",ja:"チェンマイ旧市街"},
          shortDesc:{en:"Ancient walls, temples & night bazaar",zh:"古城墙、寺庙和夜市",th:"กำแพงเมืองเก่า วัด และตลาดกลางคืน",ja:"古い城壁、寺院、ナイトバザール"},
          detail:{en:"Walk or rent a bicycle. Must-see: Wat Phra Singh, Wat Chedi Luang. Sunday Walking Street is huge.",zh:"步行或租自行车。必看：帕辛寺、柴迪隆寺。周日夜市规模巨大。",th:"เดินหรือปั่นจักรยาน ต้องดู: วัดพระสิงห์ วัดเจดีย์หลวง ถนนคนเดินวันอาทิตย์ใหญ่",ja:"徒歩または自転車。必見：ワット・プラシン、ワット・チェディルアン。日曜歩行者天国は圧巻。"},
          station:{en:"Chiang Mai Airport + city songthaew",zh:"清迈机场+红色双条车",th:"สนามบินเชียงใหม่ + สองแถวแดง",ja:"チェンマイ空港 + 市内ソンテウ"},
          url:"https://www.tourismchiangmai.org/" },
        { id:5, img:"https://picsum.photos/id/29/400/300", title:{en:"Doi Suthep",zh:"素贴山双龙寺",th:"ดอยสุเทพ",ja:"ドイ・ステプ"},
          shortDesc:{en:"Mountain temple with golden pagoda",zh:"山顶金塔寺庙",th:"วัดบนดอยที่มีเจดีย์ทองคำ",ja:"黄金の仏塔がある山頂寺院"},
          detail:{en:"From Chiang Mai, take songthaew from Pratu Chang Phuak. 306 steps or cable car. Panoramic city view.",zh:"从清迈古城乘坐双条车。306级台阶或缆车。城市全景。",th:"จากเชียงใหม่นั่งสองแถวจากประตูช้างเผือก 306 ขั้นหรือกระเช้า วิวเมืองพาโนรามา",ja:"チェンマイからチャンプアック門発のソンテウ。306段の階段またはケーブルカー。絶景。"},
          station:{en:"Songthaew from Chang Phuak Gate",zh:"昌卜克门乘双条车",th:"สองแถวจากประตูช้างเผือก",ja:"チャンプアック門からソンテウ"},
          url:"https://www.doisuthep.com/" },
        { id:6, img:"https://picsum.photos/id/163/400/300", title:{en:"Patong Beach, Phuket",zh:"普吉岛芭东海滩",th:"หาดป่าตอง ภูเก็ต",ja:"パトンビーチ（プーケット）"},
          shortDesc:{en:"Lively beach with water sports & nightlife",zh:"热闹海滩，水上活动和夜生活",th:"ชายหาดคึกคัก กีฬาทางน้ำ กลางคืนสนุก",ja:"ウォータースポーツとナイトライフが楽しめる賑やかなビーチ"},
          detail:{en:"Jet ski, banana boat, and Bangla Road for parties. Best for first-time visitors to Phuket.",zh:"摩托艇、香蕉船和邦古拉街派对。适合第一次来普吉岛的游客。",th:"เจ็ทสกี เรือกล้วย และถนนบางลาสำหรับปาร์ตี้ เหมาะสำหรับผู้มาเยือนภูเก็ตครั้งแรก",ja:"ジェットスキー、バナナボート、パーティーならバングラ通り。プーケット初訪問者に最適。"},
          station:{en:"Phuket Airport + taxi (45 min)",zh:"普吉机场+出租车45分钟",th:"สนามบินภูเก็ต + แท็กซี่ 45 นาที",ja:"プーケット空港 + タクシーで45分"},

        { id:7, img:"https://picsum.photos/id/130/400/300", title:{en:"Phi Phi Islands",zh:"皮皮岛",th:"หมู่เกาะพีพี",ja:"ピピ諸島"},
          shortDesc:{en:"Crystal clear water, Maya Bay",zh:"清澈海水，玛雅湾",th:"น้ำใสมาก อ่าวมาหยา",ja:"透き通った海、マヤ湾"},
          detail:{en:"Speedboat tour from Phuket or Krabi. Snorkeling, colorful fish, limestone cliffs. Maya Bay is currently periodically closed for recovery – check before travel.",zh:"从普吉或甲米坐快艇。浮潜、彩色鱼群、石灰岩悬崖。玛雅湾定期关闭修复，出行前请查询。",th:"เรือสปีดโบ๊ทจากภูเก็ต ดำน้ำตื้น ปลาสีสัน หน้าผาหินปูน อ่าวมาหยาปิดฟื้นฟูเป็นระยะ ตรวจสอบก่อนเดินทาง",ja:"プーケットまたはクラビからスピードボート。シュノーケリング、色とりどりの魚、石灰岩の崖。マヤ湾は定期的に閉鎖あり、事前確認を。"},
          station:{en:"Rassada Pier (Phuket) + speedboat",zh:"普吉Rassada码头+快艇",th:"ท่าเรือรัษฎา + สปีดโบ๊ท",ja:"ラッサダー埠頭（プーケット）+ スピードボート"},
          url:"https://www.phiphiisland.com/" },
        { id:8, img:"https://picsum.photos/id/94/400/300", title:{en:"Phuket Old Town",zh:"普吉镇老街",th:"เมืองเก่าภูเก็ต",ja:"プーケット旧市街"},
          shortDesc:{en:"Sino-Portuguese architecture & cafes",zh:"中葡风格建筑和咖啡店",th:"สถาปัตยกรรมจีน-โปรตุเกส ร้านกาแฟ",ja:"シノ・ポルトガル様式の建築とカフェ"},
          detail:{en:"Colorful heritage buildings. Sunday Walking Street Market has amazing street food. Great for Instagram.",zh:"多彩的遗产建筑。周日夜市有很棒的小吃。适合拍照。",th:"อาคารมรดกสีสันสดใส ตลาดนัดวันอาทิตย์มีอาหารข้างทางที่ยอดเยี่ยม เหมาะแก่การถ่ายรูป",ja:"カラフルな歴史的建造物。日曜歩行者天国マーケットの屋台は絶品。インスタ映え抜群。"},
          station:{en:"Local bus or taxi from beaches",zh:"从海滩坐当地巴士或出租车",th:"รถประจำทางหรือแท็กซี่จากหาด",ja:"ビーチから地元バスまたはタクシー"},
          url:"https://oldtownphuket.com/" },
        { id:9, img:"https://picsum.photos/id/42/400/300", title:{en:"Damnoen Saduak Floating Market",zh:"丹嫩沙多水上市场",th:"ตลาดน้ำดำเนินสะดวก",ja:"ダムヌン・サドアク水上マーケット"},
          shortDesc:{en:"Paddle boats selling fresh food",zh:"划船售卖新鲜食物",th:"เรือ paddles ขายอาหารสด",ja:"新鮮な料理を売る手漕ぎボート"},
          detail:{en:"Day trip from Bangkok (1.5h drive). Best early morning to avoid crowds. Hire long-tail boat (negotiate price).",zh:"从曼谷出发1.5小时车程。建议清晨去避开人群。租长尾船（议价）。",th:"ทริปวันเดียวจากกรุงเทพฯ (ขับรถ 1.5 ชม.) ดีที่สุดในช่วงเช้าเพื่อหลีกเลี่ยงฝูงชน เช่าเรือหางยาว (ต่อรองราคา)",ja:"バンコクから日帰り（車で1.5時間）。混雑避けるなら早朝がベスト。長尾船をチャーター（価格交渉）。"},
          station:{en:"Minivan from Southern Bus Terminal",zh:"南部汽车站小巴",th:"รถตู้จากสถานีขนส่งสายใต้",ja:"南部バスターミナルからミニバン"},
          url:"https://www.damnoensaduak.com/" },
        { id:10, img:"https://picsum.photos/id/39/400/300", title:{en:"Khao Soi (Chiang Mai dish)",zh:"清迈咖喱面",th:"ข้าวซอยเชียงใหม่",ja:"カオソーイ（チェンマイ料理）"},
          shortDesc:{en:"Northern Thai curry noodle soup",zh:"泰北咖喱面汤",th:"แกงกะหรี่เส้น ภาคเหนือ",ja:"タイ北部のカレー風味の麺料理"},
          detail:{en:"Try at Khao Soi Khun Yai (famous local spot). Rich coconut curry, crispy noodles on top. Best lunch.",zh:"在Khao Soi Khun Yai（著名本地餐厅）品尝。浓郁的椰奶咖喱，顶部有脆面。最佳午餐。",th:"ลองที่ข้าวซอยคุณยาย ร้านดัง กะทิเข้มข้น เส้นกรอบด้านบน อาหารกลางวันที่สุดยอด",ja:"カオソーイ・クンヤイ（地元で有名）で試す。濃厚なココナッツカレー、上に揚げ麺。最高のランチ。"},
          station:{en:"Nimman area or Old City",zh:"宁曼路或古城区域",th:"ย่านนิมมาน หรือเมืองเก่า",ja:"ニマン地区または旧市街"},
          url:"https://www.chiangmaicitylife.com/food/khao-soi/" },
        { id:11, img:"https://picsum.photos/id/431/400/300", title:{en:"Chao Phraya River Cruise",zh:"湄南河游船",th:"ล่องเรือเจ้าพระยา",ja:"チャオプラヤ川クルーズ"},
          shortDesc:{en:"Dinner cruise with temple lights",zh:"夜景晚餐船，看寺庙灯光",th:"อาหารค่ำลอยน้ำ ชมวัดแสงสี",ja:"寺院のライトアップを楽しむディナークルーズ"},
          detail:{en:"Boards from Saphan Taksin pier. Evening cruise includes Thai buffet, live music, and views of Wat Arun lit up.",zh:"从Saphan Taksin码头登船。晚间巡航包括泰式自助餐、现场音乐和黎明寺灯光。",th:"ขึ้นเรือที่ท่าสะพานตากสิน เรือตอนเย็นรวมบุฟเฟ่ต์ไทย ดนตรีสด และชมวัดอรุณสว่าง",ja:"サパーンタクシン桟橋から出発。夜のクルーズはタイ料理ビュッフェ、生演奏、ライトアップされたワット・アルンが楽しめます。"},
          station:{en:"BTS Saphan Taksin",zh:"BTS Saphan Taksin站",th:"BTS สะพานตากสิน",ja:"BTSサパーンタクシン駅"},
          url:"https://www.chaophrayacruise.com/" }
    ];

    // 無料版では最初の6件を簡素に表示
    const freePlaces = fullPlaces.slice(0,6).map(p => ({
        ...p,
        shortDesc: { en: p.shortDesc.en.substring(0,60)+"...", zh: p.shortDesc.zh.substring(0,50)+"...", th: p.shortDesc.th.substring(0,50)+"...", ja: p.shortDesc.ja.substring(0,50)+"..." },
        detail: { en: "🔒 Premium feature. Pay to unlock full details (access, stations, maps).", zh: "🔒 高级功能。付费解锁完整信息（交通、车站、地图）。", th: "🔒 ฟีเจอร์พรีเมียม จ่ายเพื่อปลดล็อกรายละเอียดเต็ม", ja: "🔒 プレミアム機能。支払いで完全詳細（アクセス、駅、地図）を解放。" }
    }));

    // ======================= 多言語UI =======================
    const translations = {
        en: { title: "✨ Thailand Travel Guide", sponsorBtn: "Visit Site", backBtn: "← Back", officialSite: "Official Website", upgradeTeaser: "🔒 6 more places & detailed access info available in Premium", upgradeBtn: "⭐ Upgrade to Premium (PayPal)", freeBadge: "🆓 Free", premiumBadge: "⭐ Premium" },
        zh: { title: "✨ 泰国旅游指南", sponsorBtn: "访问官网", backBtn: "← 返回", officialSite: "官方网站", upgradeTeaser: "🔒 另外6个景点和详细信息仅在高级版提供", upgradeBtn: "⭐ 升级到高级版 (PayPal)", freeBadge: "🆓 免费版", premiumBadge: "⭐ 高级版" },
        th: { title: "✨ คู่มือท่องเที่ยวไทย", sponsorBtn: "เว็บไซต์ทางการ", backBtn: "← กลับ", officialSite: "เว็บไซต์ทางการ", upgradeTeaser: "🔒 อีก 6 สถานที่และข้อมูลเพิ่มเติมในเวอร์ชันพรีเมียม", upgradeBtn: "⭐ อัปเกรดเป็นพรีเมียม (PayPal)", freeBadge: "🆓 ฟรี", premiumBadge: "⭐ พรีเมียม" },
        ja: { title: "✨ タイ旅行ガイド", sponsorBtn: "公式サイトへ", backBtn: "← 戻る", officialSite: "公式サイト", upgradeTeaser: "🔒 残り6スポットと詳細アクセス情報はプレミアム版で", upgradeBtn: "⭐ プレミアムにアップグレード (PayPal)", freeBadge: "🆓 無料版", premiumBadge: "⭐ プレミアム" }
    };

    let currentLang = 'en';
    let currentSlide = 0;
    let selectedPlace = null;
    let isPremium = localStorage.getItem('thailand_premium') === 'true';

    // 決済成功時のリダイレクト対応
    function checkPaymentSuccess() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('payment') === 'success') {
            localStorage.setItem('thailand_premium', 'true');
            isPremium = true;
            // パラメータを除去して再読み込み
            window.history.replaceState({}, document.title, window.location.pathname);
            location.reload();
        }
    }

    function getCurrentPlaces() {
        return isPremium ? fullPlaces : freePlaces;
    }

    function updateUIByPremium() {
        const badge = document.getElementById('premiumStatusBadge');
        badge.innerText = translations[currentLang][isPremium ? 'premiumBadge' : 'freeBadge'];
        badge.style.background = isPremium ? '#ffaa44' : '#888';
        const teaserDiv = document.getElementById('upgradeTeaser');
        teaserDiv.style.display = isPremium ? 'none' : 'flex';
        if (!isPremium) {
            document.getElementById('slide2').classList.add('hidden');
            document.getElementById('carouselNav').style.display = 'none';
        } else {
            document.getElementById('slide2').classList.remove('hidden');
            document.getElementById('carouselNav').style.display = 'flex';
        }
        renderCarousel();
        if (selectedPlace !== null) showDetail(selectedPlace);
    }

    function renderCarousel() {
        const places = getCurrentPlaces();
        const slide1 = document.getElementById('slide1');
        const slide2 = document.getElementById('slide2');
        const items1 = places.slice(0,6);
        const items2 = isPremium ? places.slice(6,12) : [];
        slide1.innerHTML = '';
        slide2.innerHTML = '';
        items1.forEach(p => createCard(p, slide1));
        if (isPremium) items2.forEach(p => createCard(p, slide2));
        updateDots();
    }

    function createCard(place, container) {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => {
            if (!isPremium && place.id >= 6) {
                showPaypalModal();
                return;
            }
            showDetail(place.id);
        };
        const img = document.createElement('img');
        img.src = place.img;
        img.alt = place.title[currentLang];
        img.className = 'card-img';
        const content = document.createElement('div');
        content.className = 'card-content';
        const title = document.createElement('div');
        title.className = 'card-title';
        title.innerText = place.title[currentLang];
        const desc = document.createElement('div');
        desc.className = 'card-desc';
        desc.innerText = place.shortDesc[currentLang];
        content.appendChild(title);
        content.appendChild(desc);
        card.appendChild(img);
        card.appendChild(content);
        container.appendChild(card);
    }

    function updateDots() {
        const nav = document.getElementById('carouselNav');
        nav.innerHTML = '';
        if (!isPremium) return;
        for (let i = 0; i < 2; i++) {
            const dot = document.createElement('div');
            dot.className = 'nav-dot' + (i === currentSlide ? ' active' : '');
            dot.onclick = () => goToSlide(i);
            nav.appendChild(dot);
        }
    }

    function goToSlide(index) {
        const wrapper = document.getElementById('carouselWrapper');
        const slideWidth = wrapper.clientWidth;
        wrapper.scrollTo({ left: index * slideWidth, behavior: 'smooth' });
        currentSlide = index;
        updateDots();
    }

    function initCarouselScroll() {
        const wrapper = document.getElementById('carouselWrapper');
        wrapper.addEventListener('scroll', () => {
            const newIndex = Math.round(wrapper.scrollLeft / wrapper.clientWidth);
            if (newIndex !== currentSlide) {
                currentSlide = newIndex;
                updateDots();
            }
        });
        window.addEventListener('resize', () => goToSlide(currentSlide));
    }

    function showDetail(id) {
        const place = getCurrentPlaces().find(p => p.id === id);
        if (!place) return;
        selectedPlace = id;
        const detailDiv = document.getElementById('detailView');
        const mainView = document.getElementById('mainView');
        mainView.classList.add('hidden');
        detailDiv.classList.remove('hidden');
        const trans = translations[currentLang];
        let detailHtml = `
            <div class="detail-page">
                <button class="back-btn" id="backToListBtn">${trans.backBtn}</button>
                <img class="detail-img" src="${place.img}" alt="${place.title[currentLang]}">
                <h2>${place.title[currentLang]}</h2>
                <p><strong>⭐</strong> ${place.shortDesc[currentLang]}</p>
        `;
        if (isPremium) {
            detailHtml += `
                <p><strong>⭐ Details</strong><br> ${place.detail[currentLang]}</p>
                <p><strong>📍 Nearest station / transport</strong><br> ${place.station[currentLang]}</p>
                <a href="${place.url}" target="_blank" class="official-link">${trans.officialSite} ↗</a>
            `;
        } else {
            detailHtml += `<p style="color:var(--accent); margin-top:1rem;">🔓 ${trans.upgradeTeaser}</p><button id="upgradeFromDetail" class="upgrade-btn">${trans.upgradeBtn}</button>`;
        }
        detailHtml += `</div>`;
        detailDiv.innerHTML = detailHtml;
        document.getElementById('backToListBtn').onclick = () => {
            detailDiv.classList.add('hidden');
            mainView.classList.remove('hidden');
            selectedPlace = null;
        };
        const upgradeBtn = document.getElementById('upgradeFromDetail');
        if (upgradeBtn) upgradeBtn.onclick = () => showPaypalModal();
    }

    function showPaypalModal() {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'lock-overlay';
        modalDiv.innerHTML = `
            <div class="paypal-modal">
                <h3>💎 Unlock Premium</h3>
                <p>✔ Full 12 places<br>✔ Transport & station info<br>✔ Official links & maps</p>
                <div id="paypal-hosted-button-container"></div>
                <button id="closePaypalModal" style="margin-top:1rem;">Cancel</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('closePaypalModal').onclick = () => modalDiv.remove();

        // ホステッドボタンをレンダリング
        if (window.paypal && window.paypal.HostedButtons) {
            window.paypal.HostedButtons({
                hostedButtonId: "WH3HTQG46AHBG"
            }).render("#paypal-hosted-button-container");
        } else {
            modalDiv.innerHTML += '<p style="color:red;">⚠️ PayPal Hosted Buttons SDK not loaded. Check your client ID.</p>';
        }
    }

    function updateLanguage() {
        document.getElementById('page-title').innerText = translations[currentLang].title;
        document.querySelectorAll('.sponsor-btn').forEach(btn => btn.innerText = translations[currentLang].sponsorBtn);
        const teaserDiv = document.getElementById('upgradeTeaser');
        if (teaserDiv && !isPremium) {
            teaserDiv.querySelector('span').innerText = translations[currentLang].upgradeTeaser;
            teaserDiv.querySelector('button').innerText = translations[currentLang].upgradeBtn;
        }
        updateUIByPremium();
        if (selectedPlace !== null) showDetail(selectedPlace);
    }

    function initTheme() {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (!localStorage.getItem('theme')) {
            document.body.classList.toggle('light', !prefersDark);
        } else {
            document.body.classList.toggle('light', localStorage.getItem('theme') === 'light');
        }
        document.getElementById('themeToggle').onclick = () => {
            document.body.classList.toggle('light');
            localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
        };
    }

    function initLang() {
        const btns = document.querySelectorAll('.lang-btn');
        btns.forEach(btn => {
            btn.onclick = () => {
                currentLang = btn.dataset.lang;
                btns.forEach(b => b.classList.remove('active-lang'));
                btn.classList.add('active-lang');
                updateLanguage();
            };
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkPaymentSuccess(); // リダイレクト後の処理
        document.getElementById('showPaypalModalBtn').onclick = showPaypalModal;
        initCarouselScroll();
        initTheme();
        initLang();
        updateUIByPremium();
        goToSlide(0);
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => console.log('SW registered')).catch(err => console.log('SW failed', err));
        });
    }
</script>
</body>
</html>
